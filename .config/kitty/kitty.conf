# One Half Dark, while keeping Kitty's font size.

font_family Cascadia Mono NF
font_size 11.0

# One Half Dark colors
foreground #dcdfe4
background #282c34
selection_foreground #000000
selection_background #fffacd
cursor #dcdfe4
cursor_text_color #282c34
url_color #0087bd
cursor_shape block
cursor_blink_interval -1

# One Half Dark terminal palette
color0  #282c34
color1  #e06c75
color2  #98c379
color3  #e5c07b
color4  #61afef
color5  #c678dd
color6  #56b6c2
color7  #dcdfe4
color8  #5d677a
color9  #e06c75
color10 #98c379
color11 #e5c07b
color12 #61afef
color13 #c678dd
color14 #56b6c2
color15 #dcdfe4

# One Half Dark tab bar
tab_bar_background #20232a
active_tab_foreground #444444
active_tab_background #fffacd
inactive_tab_foreground #dcdfe4
inactive_tab_background #20232a

# History and initial size
scrollback_lines 10000
remember_window_size no
initial_window_width 154c
initial_window_height 45c

# Match GNOME Terminal's audible bell and opaque background.
enable_audio_bell yes
background_opacity 1.0

# Paste from the system clipboard with Ctrl+V.
map ctrl+v paste_from_clipboard
